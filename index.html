<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft パーティクル ホログラム生成ツール</title>
    <!-- Tailwind CSS for layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip for datapack -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Google Fonts: DotGothic16 for Minecraft style text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    
    <style>
        body {
            /* マイクラのDirt(土)ブロック風の背景パターン */
            background-color: #593D29;
            background-image: 
                linear-gradient(45deg, #4A3322 25%, transparent 25%, transparent 75%, #4A3322 75%, #4A3322),
                linear-gradient(45deg, #4A3322 25%, transparent 25%, transparent 75%, #4A3322 75%, #4A3322);
            background-size: 32px 32px;
            background-position: 0 0, 16px 16px;
            
            font-family: 'DotGothic16', sans-serif;
            color: #ffffff;
        }

        /* マイクラのテキスト影 */
        .mc-text {
            color: #ffffff;
            text-shadow: 2px 2px 0 #3f3f3f;
        }
        .mc-text-yellow {
            color: #ffff55;
            text-shadow: 2px 2px 0 #3f3f00;
        }
        .mc-text-dark {
            color: #333333;
        }

        /* マイクラのGUIパネル (インベントリ風) */
        .mc-panel {
            background-color: #c6c6c6;
            border: 3px solid #000; /* 外枠 */
            box-shadow: inset 3px 3px 0 #ffffff, inset -3px -3px 0 #555555; /* 内側のハイライトとシャドウ */
            padding: 20px;
            margin-bottom: 24px;
            color: #222; /* パネル内の基本テキスト色は黒系 */
        }

        /* マイクラ風のボタン */
        .mc-btn {
            display: inline-block;
            background-color: #c6c6c6;
            border: 3px solid;
            border-top-color: #ffffff;
            border-left-color: #ffffff;
            border-right-color: #555555;
            border-bottom-color: #555555;
            color: #111;
            font-family: 'DotGothic16', sans-serif;
            text-shadow: 1px 1px 0 #fff; /* 彫り込み風の影 */
            padding: 10px 20px;
            cursor: pointer;
            transition: none; /* マイクラにアニメーションはない */
        }
        .mc-btn:hover:not(:disabled) {
            background-color: #8da3d4; /* ホバー時は青っぽく */
        }
        .mc-btn:active:not(:disabled) {
            border-top-color: #555555;
            border-left-color: #555555;
            border-right-color: #ffffff;
            border-bottom-color: #ffffff;
            padding-top: 11px; /* 押下時の沈み込み */
            padding-bottom: 9px;
        }
        .mc-btn:disabled {
            color: #888;
            cursor: not-allowed;
            text-shadow: 1px 1px 0 #e0e0e0;
        }

        /* 入力フィールド */
        .mc-input {
            width: 100%;
            background-color: #000000;
            border: 2px solid;
            border-top-color: #555555;
            border-left-color: #555555;
            border-right-color: #ffffff;
            border-bottom-color: #ffffff;
            color: #ffffff;
            padding: 10px;
            font-family: 'DotGothic16', sans-serif;
        }
        .mc-input:focus {
            outline: 2px solid #ffffff;
            outline-offset: -2px;
        }

        /* スライダー (range) */
        .mc-slider {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        .mc-slider::-webkit-slider-runnable-track {
            width: 100%;
            height: 10px;
            background: #000;
            border: 2px solid;
            border-top-color: #555555;
            border-left-color: #555555;
            border-bottom-color: #ffffff;
            border-right-color: #ffffff;
        }
        .mc-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 16px;
            background: #c6c6c6;
            border: 2px solid;
            border-top-color: #ffffff;
            border-left-color: #ffffff;
            border-bottom-color: #555555;
            border-right-color: #555555;
            margin-top: -9px;
            cursor: pointer;
        }

        /* プレビューエリア */
        #previewContainer {
            width: 100%;
            height: 250px;
            background-color: #000000;
            border: 3px solid;
            border-top-color: #555555;
            border-left-color: #555555;
            border-right-color: #ffffff;
            border-bottom-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }
        #previewImage {
            max-width: 100%;
            max-height: 100%;
            display: none;
            image-rendering: pixelated; /* ドット絵をくっきり表示 */
        }
        #uploadPlaceholder {
            text-align: center;
            color: #aaaaaa;
        }

        /* 出力エリア (コマンド) */
        #outputArea {
            width: 100%;
            height: 200px;
            background-color: #000000;
            color: #55ff55; /* マイクラの緑テキスト */
            border: 3px solid;
            border-top-color: #555555;
            border-left-color: #555555;
            border-right-color: #ffffff;
            border-bottom-color: #ffffff;
            padding: 12px;
            font-family: monospace; /* コマンドなので等幅 */
            font-size: 14px;
            resize: vertical;
            white-space: pre;
            overflow-x: auto;
            display: none;
        }

        /* 進捗(アチーブメント)風のトースト通知 */
        .mc-toast {
            position: fixed;
            top: 20px;
            right: -400px; /* 初期状態は画面外 */
            background-color: #212121;
            border: 3px solid #555555;
            border-top-color: #777777;
            border-left-color: #777777;
            border-right-color: #111111;
            border-bottom-color: #111111;
            color: white;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            width: 320px;
        }
        .mc-toast.show {
            right: 20px;
        }
        .toast-icon {
            width: 32px;
            height: 32px;
            background-color: #55ff55;
            border: 2px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
        }

        /* カスタムスクロールバー */
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: #000; border: 2px solid #555; }
        ::-webkit-scrollbar-thumb { 
            background: #c6c6c6; 
            border: 2px solid;
            border-top-color: #fff; border-left-color: #fff;
            border-right-color: #555; border-bottom-color: #555;
        }
    </style>
</head>

<body class="p-4 md:p-8">

<div class="max-w-4xl mx-auto">
    <h1 class="text-3xl md:text-4xl text-center mb-2 mc-text-yellow tracking-wider">ホログラムジェネレーター</h1>
    <p class="text-center text-sm mb-8 mc-text">画像をマイクラの `/particle` コマンドに変換します (対応: 1.21.2+)</p>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- 左カラム：画像アップロード -->
        <div class="mc-panel">
            <h2 class="text-xl font-bold mb-4 mc-text-dark border-b-2 border-gray-400 pb-2">1. 画像をアップロード</h2>
            
            <div id="previewContainer" onclick="document.getElementById('imageInput').click()">
                <div id="uploadPlaceholder">
                    <p class="text-xl mb-2">クリックして選択</p>
                    <p class="text-sm text-gray-400">PNG, JPG (背景透過推奨)</p>
                </div>
                <img id="previewImage" alt="Preview">
            </div>
            <input type="file" id="imageInput" accept="image/png, image/jpeg" class="hidden">
            
            <canvas id="canvas" class="hidden"></canvas>
        </div>

        <!-- 右カラム：設定 -->
        <div class="mc-panel">
            <h2 class="text-xl font-bold mb-4 mc-text-dark border-b-2 border-gray-400 pb-2">2. ホログラム設定</h2>
            
            <div class="mb-5">
                <label class="block mb-2 font-bold mc-text-dark" for="widthInput">表示幅 (ブロック数)</label>
                <div class="flex items-center gap-3">
                    <input type="number" id="widthInput" class="mc-input w-24" value="5" min="1" max="50">
                    <span class="mc-text-dark">ブロック</span>
                </div>
            </div>

            <div class="mb-5">
                <label class="block mb-2 font-bold mc-text-dark" for="densityInput">密度 (パーティクル/ブロック)</label>
                <div class="flex items-center gap-4">
                    <input type="range" id="densityInput" class="mc-slider flex-1" min="1" max="20" value="8" oninput="document.getElementById('densityValue').textContent = this.value">
                    <span id="densityValue" class="w-8 text-center font-bold text-xl mc-text-dark">8</span>
                </div>
                <p class="text-xs text-gray-600 mt-2 leading-tight">※高くすると細かくなりますが、マイクラが重くなる場合があります</p>
            </div>

            <div class="mb-5">
                <label class="block mb-2 font-bold mc-text-dark" for="sizeInput">パーティクルの大きさ (隙間埋め)</label>
                <div class="flex items-center gap-4">
                    <input type="range" id="sizeInput" class="mc-slider flex-1" min="0.5" max="10.0" step="0.1" value="2.5" oninput="document.getElementById('sizeValue').textContent = parseFloat(this.value).toFixed(1)">
                    <span id="sizeValue" class="w-8 text-center font-bold text-xl mc-text-dark">2.5</span>
                </div>
                <p class="text-xs text-gray-600 mt-2 leading-tight">※値を大きくすると点が繋がり、面のように見えます</p>
            </div>

            <div class="mb-5">
                <label class="block mb-2 font-bold mc-text-dark" for="basePosInput">基準座標</label>
                <input type="text" id="basePosInput" class="mc-input" value="~ ~2 ~" placeholder="X Y Z">
                <p class="text-xs text-gray-600 mt-2 leading-tight">※この座標を中心に画像が生成されます</p>
            </div>
            
            <div class="mt-6 flex flex-col gap-3">
                <button id="generateBtn" class="mc-btn w-full text-lg" disabled>コマンドを生成する</button>
                <button id="downloadDatapackBtn" class="mc-btn w-full text-lg" style="display: none; color: #006600;">データパック出力 (1.21.8)</button>
            </div>
        </div>
    </div>

    <!-- 結果エリア -->
    <div class="mc-panel">
        <div class="flex justify-between items-end mb-4 border-b-2 border-gray-400 pb-2">
            <h2 class="text-xl font-bold mc-text-dark">3. 生成結果</h2>
            <button id="copyBtn" class="mc-btn text-sm py-1 px-3" style="display: none;">
                コピー
            </button>
        </div>
        
        <p id="statsText" class="text-sm text-gray-600 mb-4 leading-relaxed">画像を選択し、設定を調整して「コマンドを生成する」を押してください。</p>
        
        <textarea id="outputArea" readonly></textarea>
    </div>
</div>

<!-- 進捗(アチーブメント)風の通知 -->
<div id="toast" class="mc-toast">
    <div class="toast-icon">!</div>
    <div>
        <div class="text-yellow-400 text-sm mb-1" id="toastTitle">進捗達成！</div>
        <div class="text-base" id="toastMessage">コピーしました</div>
    </div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const previewImage = document.getElementById('previewImage');
    const uploadPlaceholder = document.getElementById('uploadPlaceholder');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    const widthInput = document.getElementById('widthInput');
    const densityInput = document.getElementById('densityInput');
    const sizeInput = document.getElementById('sizeInput');
    const basePosInput = document.getElementById('basePosInput');
    
    const generateBtn = document.getElementById('generateBtn');
    const downloadDatapackBtn = document.getElementById('downloadDatapackBtn');
    const outputArea = document.getElementById('outputArea');
    const copyBtn = document.getElementById('copyBtn');
    const statsText = document.getElementById('statsText');
    const toast = document.getElementById('toast');
    const toastTitle = document.getElementById('toastTitle');
    const toastMessage = document.getElementById('toastMessage');

    let loadedImage = null;
    let generatedCommands = []; // 生成されたコマンドを保持

    // 画像アップロード処理
    imageInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                loadedImage = img;
                previewImage.src = img.src;
                previewImage.style.display = 'block';
                uploadPlaceholder.style.display = 'none';
                generateBtn.disabled = false;
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    });

    // コマンド生成処理
    generateBtn.addEventListener('click', () => {
        if (!loadedImage) return;

        const targetWidthBlocks = parseFloat(widthInput.value);
        const density = parseInt(densityInput.value);
        const sizeMultiplier = parseFloat(sizeInput.value);
        const basePos = basePosInput.value.trim().split(/\s+/); // ['~', '~2', '~'] などを想定

        if (basePos.length !== 3) {
            showToast("エラー", "基準座標はスペース区切りで3つの値 (X Y Z) を入力してください。");
            return;
        }

        // キャンバスサイズを密度に合わせて計算
        const canvasWidth = Math.floor(targetWidthBlocks * density);
        const scaleFactor = canvasWidth / loadedImage.width;
        const canvasHeight = Math.floor(loadedImage.height * scaleFactor);

        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        // 画像をキャンバスに描画（リサイズ）
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(loadedImage, 0, 0, canvas.width, canvas.height);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;

        let commands = [];
        let particleCount = 0;

        // ピクセルごとの処理
        for (let y = 0; y < canvasHeight; y++) {
            for (let x = 0; x < canvasWidth; x++) {
                const index = (y * canvasWidth + x) * 4;
                const r = data[index];
                const g = data[index + 1];
                const b = data[index + 2];
                const a = data[index + 3];

                // 透明なピクセルは無視 (アルファ値が低いもの)
                if (a > 10) {
                    const rFloat = (r / 255).toFixed(3);
                    const gFloat = (g / 255).toFixed(3);
                    const bFloat = (b / 255).toFixed(3);

                    // 中心を0とするためのオフセット
                    const offsetX = (x - canvasWidth / 2) / density;
                    const offsetY = (canvasHeight - y) / density; 
                    const offsetZ = 0; 

                    // ベース座標にオフセットを適用
                    const finalX = applyOffset(basePos[0], offsetX);
                    const finalY = applyOffset(basePos[1], offsetY);
                    const finalZ = applyOffset(basePos[2], offsetZ);

                    // Minecraft 1.21.2以降の新しいdustパーティクル構文 (コンポーネント形式)
                    // sizeMultiplier を掛けてパーティクル自体の大きさを調整
                    const pSize = (sizeMultiplier / density).toFixed(2);
                    const cmd = `particle dust{color:[${rFloat},${gFloat},${bFloat}],scale:${pSize}} ${finalX} ${finalY} ${finalZ} 0 0 0 0 1`;
                    commands.push(cmd);
                    particleCount++;
                }
            }
        }

        generatedCommands = commands;

        // 結果の表示
        outputArea.textContent = commands.join('\n');
        outputArea.style.display = 'block';
        copyBtn.style.display = 'inline-block';
        downloadDatapackBtn.style.display = 'inline-block';
        
        statsText.innerHTML = `生成完了: <strong>${particleCount}</strong> 個のパーティクル<br>
                               解像度: ${canvasWidth} x ${canvasHeight} ピクセル<br>
                               <span style="color:#006600; font-weight:bold;">データパックの場合は /function hologram:draw を実行してください。</span>`;
                               
        showToast("生成完了", `${particleCount} 個のコマンドを作成しました`);
    });

    // データパックのダウンロード処理
    downloadDatapackBtn.addEventListener('click', () => {
        if (generatedCommands.length === 0) return;

        const zip = new JSZip();

        // pack.mcmetaの生成 (1.21.8用 = pack_format 61)
        const mcmeta = {
            "pack": {
                "pack_format": 61,
                "supported_formats": {"min_inclusive": 61, "max_inclusive": 70},
                "description": "Hologram Particle Pack (1.21.8)"
            }
        };
        zip.file("pack.mcmeta", JSON.stringify(mcmeta, null, 2));

        // .mcfunctionファイルの生成
        const functionContent = generatedCommands.join('\n');
        // namespace: hologram
        zip.folder("data").folder("hologram").folder("function").file("draw.mcfunction", functionContent);

        // ZIPを生成してダウンロード
        zip.generateAsync({ type: "blob" }).then(function(content) {
            const url = URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = url;
            a.download = "hologram_datapack_1_21_8.zip";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast("ダウンロード完了", "ZIPファイルを保存しました！");
        });
    });

    // 座標オフセット計算用ヘルパー関数
    function applyOffset(baseStr, offsetVal) {
        if (offsetVal === 0) return baseStr;
        
        // ~ または ^ を含む相対座標の場合
        if (baseStr.startsWith('~') || baseStr.startsWith('^')) {
            const prefix = baseStr.charAt(0);
            let val = parseFloat(baseStr.substring(1)) || 0;
            const result = val + offsetVal;
            return Math.abs(result) < 0.001 ? prefix : `${prefix}${result.toFixed(3)}`;
        } 
        // 絶対座標の場合
        else {
            let val = parseFloat(baseStr) || 0;
            return (val + offsetVal).toFixed(3);
        }
    }

    // コピー機能
    copyBtn.addEventListener('click', () => {
        outputArea.select();
        document.execCommand('copy');
        
        showToast("進捗達成！", "コマンドをコピーしました");
    });

    // マイクラのアチーブメント風トースト通知
    let toastTimeout;
    function showToast(title, message) {
        toastTitle.textContent = title;
        toastMessage.textContent = message;
        
        toast.classList.add('show');
        
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 4000); // 4秒後に消える
    }
</script>
</body>
</html>
